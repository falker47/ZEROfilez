name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax checks
        run: |
          node --check js/windows-setup.js
          node --check js/pc-selection.js
          node --check js/startup.js
          node --check js/main.js
          node --check scripts/update-links.js

      - name: Run tests
        run: node --test tests/*.test.mjs

  windows-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests with isolated WinGet stub
        shell: pwsh
        run: |
          $testFiles = Get-ChildItem tests/*.test.mjs | ForEach-Object FullName
          # PowerShell native integration fixtures spawn many subprocesses; avoid cross-file contention.
          node --test --test-concurrency=1 $testFiles
          if ($LASTEXITCODE -ne 0) { throw "Windows regression tests failed with exit code $LASTEXITCODE." }

      - name: Install Hermes through the generated setup in this isolated Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:TEMP 'ZEROfilez-Hermes-setup.ps1'
          node scripts/generate-hermes-setup.mjs | Set-Content -LiteralPath $setup -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate the Hermes-only setup script.' }
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $setup
          if ($LASTEXITCODE -ne 0) { throw "Generated Hermes setup failed with exit code $LASTEXITCODE." }

          $expectedPublisher = 'CN=Nous Research Inc., O=Nous Research Inc., L=Austin, S=Texas, C=US'
          $installed = Get-AppxPackage | Where-Object {
            $_.Publisher -eq $expectedPublisher -and $_.Name -match 'Hermes'
          } | Select-Object -First 1
          if (-not $installed) { throw 'Hermes was not registered for the isolated runner user after setup.' }
          Write-Host "Verified Hermes package $($installed.Name) version $($installed.Version), publisher $($installed.Publisher)."

      - name: Install OpenClaw through the generated setup in this isolated Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:TEMP 'ZEROfilez-OpenClaw-setup.ps1'
          node scripts/generate-openclaw-setup.mjs | Set-Content -LiteralPath $setup -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate the OpenClaw-only setup script.' }
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $setup
          if ($LASTEXITCODE -ne 0) { throw "Generated OpenClaw setup failed with exit code $LASTEXITCODE." }

          $installedPath = Join-Path $env:LOCALAPPDATA 'OpenClawTray\OpenClaw.Tray.WinUI.exe'
          if (-not (Test-Path -LiteralPath $installedPath)) { throw 'OpenClaw Windows Hub was not installed in the isolated runner.' }
          if ((Get-Item -LiteralPath $installedPath).Length -lt 1000000) { throw 'Installed OpenClaw executable was unexpectedly small.' }

          $uninstallRoot = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $registration = Get-ChildItem -LiteralPath $uninstallRoot | ForEach-Object { Get-ItemProperty -LiteralPath $_.PSPath } |
            Where-Object { $_.DisplayName -eq 'OpenClaw Companion' } | Select-Object -First 1
          if (-not $registration) { throw 'OpenClaw Companion did not register with Windows after setup.' }
          Write-Host "Verified OpenClaw Companion $($registration.DisplayVersion) at $installedPath."
