name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax checks
        run: |
          node --check js/windows-setup.js
          node --check js/startup.js
          node --check js/main.js
          node --check scripts/update-links.js

      - name: Run tests
        run: node --test tests/*.test.mjs
