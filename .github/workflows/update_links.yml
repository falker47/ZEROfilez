name: Update Download Links

on:
  schedule:
    # Run every day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  update-links:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write # Needed to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run updater (continue to validate independent successful changes)
        id: updater
        continue-on-error: true
        run: node scripts/update-links.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate catalog tests before publishing
        run: node --test tests/*.test.mjs

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Check if file changed
          if [[ -n $(git status --porcelain js/data.js) ]]; then
            echo "Updates found. Committing..."
            git add js/data.js
            git commit -m "🤖 Auto-update download links"
            git push
          else
            echo "No updates found."
          fi

      - name: Report unresolved upstream check errors
        if: steps.updater.outcome == 'failure'
        run: |
          echo "::error::One or more upstream source checks failed; see the updater log. Successful independently validated changes may have been published."
          exit 1
